<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Reel M2 Mockup</title>
<style>
/* Tokens follow design section 15 and the M1 shots in build/shots. Sizes are points (1 CSS px = 1 pt). */
:root {
  --shadow-1: 0 1px 2px rgba(0, 0, 0, .16), 0 4px 18px rgba(0, 0, 0, .22);
  --shadow-2: 0 1px 3px rgba(0, 0, 0, .22), 0 12px 40px rgba(0, 0, 0, .3);
  --font: "SF Pro Text", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  --font-display: "SF Pro Display", -apple-system, BlinkMacSystemFont, sans-serif;
  --font-rounded: "SF Pro Rounded", -apple-system, BlinkMacSystemFont, sans-serif;
  --font-cjk: "PingFang SC", "Hiragino Sans GB", "Heiti SC", sans-serif;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in: cubic-bezier(0.4, 0, 1, 1);
  --page-bg: #111214;
  --page-fg: #e8e8ea;
  --page-dim: #9a9aa0;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) { --page-bg: #f2f2f4; --page-fg: #1c1c1e; --page-dim: #6b6b70; }
}
:root[data-theme="light"] { --page-bg: #f2f2f4; --page-fg: #1c1c1e; --page-dim: #6b6b70; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page-bg); color: var(--page-fg); font-family: var(--font); -webkit-font-smoothing: antialiased; }
::selection { background: rgba(10, 132, 255, .35); }

/* Appearance of the player chrome. The video area stays black in both. */
.t-dark {
  --fg: 255, 255, 255;
  --mat-bg: rgba(36, 36, 38, .56);
  --mat-filter: blur(30px) saturate(175%) brightness(.9);
  --stroke: rgba(255, 255, 255, .12);
  --accent: #0a84ff;
  --accent-soft: rgba(10, 132, 255, .22);
  --hover: rgba(255, 255, 255, .1);
  --sep: rgba(255, 255, 255, .1);
  --menu-bg: rgba(34, 34, 36, .78);
  --menu-stroke: rgba(255, 255, 255, .14);
  --sec: .55;
  --tag: .5;
}
.t-light {
  --fg: 0, 0, 0;
  --mat-bg: rgba(248, 248, 250, .64);
  --mat-filter: blur(30px) saturate(185%) brightness(1.04);
  --stroke: rgba(0, 0, 0, .08);
  --accent: #007aff;
  --accent-soft: rgba(0, 122, 255, .16);
  --hover: rgba(0, 0, 0, .1);
  --sep: rgba(0, 0, 0, .1);
  --menu-bg: rgba(246, 246, 248, .82);
  --menu-stroke: rgba(0, 0, 0, .1);
  --sec: .68;
  --tag: .62;
}

.material {
  background: var(--mat-bg);
  backdrop-filter: var(--mat-filter);
  -webkit-backdrop-filter: var(--mat-filter);
  box-shadow: inset 0 0 0 .5px var(--stroke), var(--shadow-2);
  color: rgba(var(--fg), .85);
}

/* Window */
.window { position: relative; overflow: hidden; background: #000; font-family: var(--font); }
.video, .video > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.scrim { position: absolute; left: 0; right: 0; top: 0; height: 68px; pointer-events: none;
  background: linear-gradient(to bottom, rgba(0,0,0,.5), rgba(0,0,0,.3) 30%, rgba(0,0,0,.12) 65%, rgba(0,0,0,0)); }
.title { position: absolute; left: 80px; right: 80px; top: 0; height: 28px; line-height: 28px; text-align: center;
  font: 600 13px/28px var(--font); color: rgba(255,255,255,.88); text-shadow: 0 .5px 4px rgba(0,0,0,.45); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lights { position: absolute; left: 14px; top: 8px; display: flex; gap: 8px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.18); }
.lights i:nth-child(1) { background: #ff5f57; } .lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }
.ends { position: absolute; right: 24px; top: 0; height: 28px; display: flex; align-items: center;
  font: 500 12px var(--font); font-variant-numeric: tabular-nums; color: rgba(255,255,255,.72); text-shadow: 0 .5px 4px rgba(0,0,0,.45); }

/* Controller (design 9.3, M2 layout in 15.2) */
.controller { position: absolute; height: 80px; border-radius: 24px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.row1 { height: 20px; display: flex; align-items: center; gap: 12px; }
.time { font: 500 12px var(--font); font-variant-numeric: tabular-nums; color: rgba(var(--fg), .85); white-space: nowrap; }
.seek { position: relative; flex: 1; height: 20px; }
.track { position: absolute; left: 0; right: 0; top: 50%; height: 4px; transform: translateY(-50%); border-radius: 4px; background: rgba(var(--fg), .18); overflow: hidden; }
.seek.active .track { height: 8px; }
.track .stored { position: absolute; top: 0; bottom: 0; background: rgba(var(--fg), .4); }
.track .played { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 4px; }
.thumb { position: absolute; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: #fff; box-shadow: 0 .5px 3px rgba(0,0,0,.35); }
.loopmark { position: absolute; top: 50%; width: 3px; height: 14px; margin: -7px 0 0 -1.5px; border-radius: 2px; background: var(--accent); box-shadow: 0 0 0 1px rgba(var(--fg), .0), 0 .5px 2px rgba(0,0,0,.3); }
.looprange { position: absolute; top: 0; bottom: 0; background: var(--accent-soft); }
.row2 { position: relative; height: 32px; display: flex; align-items: center; }
.cluster { display: flex; align-items: center; }
.cluster.left { gap: 6px; }
.cluster.center { position: absolute; left: 50%; transform: translateX(-50%); }
.cluster.right { margin-left: auto; }
.btn { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: rgba(var(--fg), .9); position: relative; flex: none; }
.btn svg { width: 17px; height: 17px; }
.btn.play { width: 32px; height: 32px; }
.btn.play svg { width: 22px; height: 22px; }
.btn.on { background: var(--hover); }
.btn.lit { color: var(--accent); }
.btn.disabled { color: rgba(var(--fg), .55); }
.speed { height: 28px; min-width: 36px; padding: 0 6px; border-radius: 14px; display: grid; place-items: center;
  font: 600 13px var(--font-rounded); font-variant-numeric: tabular-nums; color: rgba(var(--fg), .9); letter-spacing: -.01em; }
.speed.changed { color: var(--accent); background: var(--accent-soft); }
.speed.on { background: var(--hover); }
.vol { width: 72px; height: 28px; position: relative; }
.vol::before, .vol::after { content: ""; position: absolute; left: 0; top: 12px; height: 4px; border-radius: 2px; }
.vol::before { right: 0; background: rgba(var(--fg), .2); }
.vol::after { width: var(--v, 47%); background: rgba(var(--fg), .75); }
.gap16 { width: 16px; } .gap20 { width: 20px; }

/* Hover and scrub pill with thumbnail (9.4, 15.2) */
.pill { position: absolute; border-radius: 12px; padding: 4px; display: flex; flex-direction: column; align-items: center;
  box-shadow: inset 0 0 0 .5px var(--stroke), var(--shadow-1); }
.pill .img { width: 192px; height: 108px; border-radius: 8px; overflow: hidden; position: relative; box-shadow: 0 0 0 .5px rgba(0,0,0,.25); }
.pill .img svg { width: 100%; height: 100%; display: block; }
.pill .t { height: 22px; display: flex; align-items: center; font: 600 12px var(--font); font-variant-numeric: tabular-nums; color: rgba(var(--fg), .9); }

/* Panels: subtitle, audio, speed (15.2) */
.panel { position: absolute; border-radius: 16px; padding: 6px; width: 320px; }
.panel h4 { margin: 0; padding: 8px 10px 6px; font: 600 13px var(--font); color: rgba(var(--fg), .9); display: flex; justify-content: space-between; align-items: baseline; }
.panel h4 span { font: 500 11px var(--font); color: rgba(var(--fg), var(--tag)); }
.prow { display: grid; grid-template-columns: 22px 1fr auto; align-items: center; column-gap: 6px; min-height: 30px; padding: 5px 10px 5px 6px; border-radius: 10px; }
.prow.hover { background: var(--hover); }
.prow .ck { width: 22px; height: 22px; display: grid; place-items: center; color: rgba(var(--fg), .85); }
.prow .ck svg { width: 14px; height: 14px; }
.prow .ck.icon { color: rgba(var(--fg), .6); }
.prow .ck.icon svg { width: 16px; height: 16px; }
.prow .lb { font: 500 13px var(--font); color: rgba(var(--fg), .9); line-height: 17px; min-width: 0; }
.prow .lb small { display: block; font: 400 11.5px var(--font); color: rgba(var(--fg), var(--sec)); line-height: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prow .lb .cjk { font-family: var(--font-cjk); }
.prow .fmt { font: 600 10.5px var(--font); letter-spacing: .03em; color: rgba(var(--fg), var(--tag)); padding: 2px 6px; border-radius: 5px; box-shadow: inset 0 0 0 .5px rgba(var(--fg), .24); }
.empty { padding: 6px 10px 10px 34px; font: 400 12px/1.45 var(--font); color: rgba(var(--fg), var(--sec)); }
.psep { height: 1px; margin: 5px 10px; background: var(--sep); }
.stepper { display: flex; align-items: center; gap: 8px; }
.stepper .val { font: 500 13px var(--font); font-variant-numeric: tabular-nums; color: rgba(var(--fg), .85); min-width: 44px; text-align: right; }
.seg2 { display: flex; height: 26px; border-radius: 8px; background: rgba(var(--fg), .08); }
.seg2 b { width: 30px; display: grid; place-items: center; color: rgba(var(--fg), .8); }
.seg2 b + b { box-shadow: inset .5px 0 0 rgba(var(--fg), .15); }
.seg2 svg { width: 12px; height: 12px; }
.chips { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; padding: 3px; margin: 2px 4px 6px; border-radius: 9px; background: rgba(var(--fg), .07); }
.chips b { height: 26px; border-radius: 7px; display: grid; place-items: center; font: 600 12px var(--font-rounded); font-variant-numeric: tabular-nums; color: rgba(var(--fg), .75); }
.chips b.sel { background: var(--accent); color: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); }

/* OSD (9.5) */
.osd { position: absolute; left: 20px; display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 14px;
  box-shadow: inset 0 0 0 .5px var(--stroke), var(--shadow-1); }
.osd svg { width: 20px; height: 20px; color: rgba(var(--fg), .7); flex: none; }
.osd .tx { font: 600 20px var(--font-rounded); font-variant-numeric: tabular-nums; color: rgba(var(--fg), .9); white-space: nowrap; letter-spacing: -.01em; }
.osd .tx em { font-style: normal; color: rgba(var(--fg), var(--sec)); font-weight: 500; }

/* Subtitles: libass output, mocked with CSS. Size 45 on the 720-line reference, PingFang SC Medium,
   white, black 2.5 outline, soft shadow. */
.subs { position: absolute; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; pointer-events: none; text-align: center; }
.sub-zh { font-family: var(--font-cjk); font-weight: 500; color: #fff; line-height: 1.22; white-space: nowrap; }
.sub-en { font-family: var(--font-cjk); font-weight: 500; color: #fff; line-height: 1.22; white-space: nowrap; }
.sub-en2 { font-family: var(--font); font-weight: 500; color: #fff; line-height: 1.25; white-space: nowrap; }

/* Next episode card (15.2) */
.next { position: absolute; width: 360px; border-radius: 20px; padding: 12px; display: flex; gap: 12px; }
.next .nt { position: relative; width: 128px; height: 72px; flex: none; border-radius: 8px; overflow: hidden; box-shadow: 0 0 0 .5px rgba(0,0,0,.25); }
.next .nt svg.scene { width: 100%; height: 100%; display: block; }
.next .nt .shade { position: absolute; inset: 0; background: rgba(0,0,0,.28); }
.next .ring { position: absolute; left: 50%; top: 50%; width: 34px; height: 34px; margin: -17px 0 0 -17px; color: #fff; }
.next .ring svg { width: 34px; height: 34px; display: block; }
.next .nb { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.next .h { display: flex; align-items: baseline; gap: 6px; font: 600 13px var(--font); color: rgba(var(--fg), .9); }
.next .h span { margin-left: auto; font: 500 12px var(--font); font-variant-numeric: tabular-nums; color: rgba(var(--fg), var(--sec)); }
.next .e { margin-top: 2px; font: 500 13px var(--font); color: rgba(var(--fg), .85); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.next .acts { margin-top: auto; display: flex; gap: 8px; justify-content: flex-end; }
.cap { height: 26px; padding: 0 12px; border-radius: 13px; display: grid; place-items: center; font: 600 12px var(--font); }
.cap.sec { background: rgba(var(--fg), .1); color: rgba(var(--fg), .85); }
.cap.pri { background: var(--accent); color: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); }

/* PiP placeholder (15.2) */
.pipbg { position: absolute; inset: -60px; filter: blur(48px) saturate(120%) brightness(.42); }
.pipbg svg { width: 100%; height: 100%; display: block; }
.pipc { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; padding-bottom: 60px; }
.pipc .tile { width: 60px; height: 60px; border-radius: 16px; background: rgba(255,255,255,.1); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.14); display: grid; place-items: center; color: rgba(255,255,255,.62); }
.pipc .tile svg { width: 28px; height: 28px; }
.pipc .h { margin-top: 18px; font: 600 15px var(--font); color: rgba(255,255,255,.78); }
.pipc .s { margin-top: 6px; font: 400 12px var(--font); color: rgba(255,255,255,.5); }
.pipc .cap { margin-top: 16px; background: rgba(255,255,255,.14); color: rgba(255,255,255,.88); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.12); }

/* Pointer */
.cursor { position: absolute; width: 17px; height: 24px; pointer-events: none; filter: drop-shadow(0 1px 1.5px rgba(0,0,0,.35)); }

/* Menu bar menus (system NSMenu, drawn for review) */
.desk { position: absolute; inset: 0; }
.menubar { position: absolute; left: 0; right: 0; top: 0; height: 26px; display: flex; align-items: center; gap: 2px; padding: 0 10px;
  font: 500 13px var(--font); }
.t-light .menubar { color: rgba(0,0,0,.85); background: rgba(255,255,255,.28); backdrop-filter: blur(20px); }
.t-dark .menubar { color: rgba(255,255,255,.88); background: rgba(0,0,0,.22); backdrop-filter: blur(20px); }
.menubar b { padding: 3px 9px; border-radius: 6px; font-weight: 500; }
.menubar b.app { font-weight: 700; }
.menubar b.open { background: rgba(var(--fg), .14); }
.menubar .clock { margin-left: auto; font-variant-numeric: tabular-nums; }
.menu { position: absolute; top: 31px; border-radius: 12px; padding: 5px; min-width: 268px; background: var(--menu-bg);
  backdrop-filter: blur(32px) saturate(180%); -webkit-backdrop-filter: blur(32px) saturate(180%);
  box-shadow: inset 0 0 0 .5px var(--menu-stroke), 0 1px 2px rgba(0,0,0,.14), 0 12px 36px rgba(0,0,0,.26); color: rgba(var(--fg), .88); }
.mi { height: 24px; display: grid; grid-template-columns: 18px 1fr auto 12px; align-items: center; padding: 0 8px 0 4px; border-radius: 7px; font: 400 13px var(--font); white-space: nowrap; column-gap: 4px; }
.mi .k { color: rgba(var(--fg), .5); font-variant-numeric: tabular-nums; letter-spacing: .04em; }
.mi .ck svg { width: 12px; height: 12px; display: block; }
.mi .sub svg { width: 10px; height: 10px; display: block; color: rgba(var(--fg), .5); }
.mi.hl { background: var(--accent); color: #fff; }
.mi.hl .k, .mi.hl .sub svg { color: rgba(255,255,255,.8); }
.mi.dis { color: rgba(var(--fg), .35); }
.mi .cjk { font-family: var(--font-cjk); }
.mi .dim { color: rgba(var(--fg), .5); }
.mi.hl .dim { color: rgba(255,255,255,.8); }
.msep { height: 1px; margin: 5px 9px; background: var(--sep); }
.mlabel { position: absolute; font: 500 12px var(--font); color: rgba(255,255,255,.7); text-shadow: 0 1px 3px rgba(0,0,0,.4); }

/* Gallery page (no query): every frame, scaled, with notes */
.gallery { max-width: 1240px; margin: 0 auto; padding: 40px 16px 80px; }
.gallery h1 { font: 700 28px var(--font-display); letter-spacing: -.02em; margin: 0 0 8px; }
.gallery > p { color: var(--page-dim); margin: 0 0 32px; max-width: 70ch; line-height: 1.5; }
.entry { margin: 0 0 44px; }
.entry h2 { font: 600 17px var(--font); margin: 0 0 4px; }
.entry p { font: 400 13px/1.5 var(--font); color: var(--page-dim); margin: 0 0 12px; max-width: 80ch; }
.pair { display: flex; gap: 16px; flex-wrap: wrap; }
.shot { position: relative; overflow: hidden; border-radius: 10px; box-shadow: 0 0 0 1px rgba(127,127,127,.25); }
.shot > .window { transform-origin: 0 0; }
.shot figcaption { position: absolute; right: 8px; bottom: 6px; font: 500 11px var(--font); color: rgba(255,255,255,.7); }
body.single { background: #000; overflow: hidden; }
</style>
</head>

// Outline and shadow: libass Outline 2.5 and Shadow 1 on the 720-line reference, scaled with the video.

function ring(progress) {

  return `<svg viewBox="0 0 34 34"><circle cx="17" cy="17" r="${r}" fill="rgba(0,0,0,.35)" stroke="rgba(255,255,255,.3)" stroke-width="2.5"/>
    <circle cx="17" cy="17" r="${r}" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="${(c * progress).toFixed(2)} ${c.toFixed(2)}" transform="rotate(-90 17 17)"/>
    <use href="#i-play" x="9.5" y="9.5" width="15" height="15" style="color:#fff"/></svg>`;
}
function nextCard(W, H, ctrl) {
  // Bottom-right, 24 pt from the right edge, bottom aligned with the controller's bottom edge,
  // or 12 pt above the controller when they would overlap.
  const w = 360;
  const left = Math.min(ctrl.left + ctrl.width - w, W - 16 - w);
  const bottom = (H - ctrl.top) + 12;
  return `<div class="next material" style="left:${left}px;bottom:${bottom}px">
    <div class="nt">${scene("forest")}<div class="shade"></div><div class="ring">${ring(.4)}</div></div>
    <div class="nb"><div class="h">Next Episode<span>in 3 s</span></div>
      <div class="e">${episodeName(NEXT)}</div>
      <div class="acts"><span class="cap sec">Cancel</span><span class="cap pri">Play Now</span></div></div>
  </div>`;
}
// "Northern.Line.S02E06.1080p..." -> "Northern Line S02E06": the stem up to the episode token.
function episodeName(file) {
  const m = file.match(/^(.*?[Ss]\d{1,2}[Ee]\d{1,3})/);
  return (m ? m[1] : file.replace(/\.[^.]+$/, "")).replace(/[._]+/g, " ");
}
function middleTruncate(s, n) { if (s.length <= n) return s; const h = Math.floor((n - 1) / 2); return s.slice(0, h) + "…" + s.slice(s.length - (n - 1 - h)); }
function cursor(x, y) { return `<svg class="cursor" style="left:${x}px;top:${y}px" viewBox="0 0 17 24"><use href="#i-cursor"/></svg>`; }

// ---------- layout fixups that need measured geometry ----------
function place(root, frame) {
  const win = root.querySelector(".window");
  const wr = win.getBoundingClientRect();
  const scale = wr.width / win.offsetWidth;
  const rel = r => ({ left: (r.left - wr.left) / scale, top: (r.top - wr.top) / scale, width: r.width / scale, height: r.height / scale });
  const ctrl = win.querySelector(".controller");
  const panel = win.querySelector("[data-panel]");
  if (panel && frame.anchor) {
    const b = rel(win.querySelector(`[data-anchor="${frame.anchor[0]}"]`).getBoundingClientRect());
    const c = rel(ctrl.getBoundingClientRect());
    const pw = panel.offsetWidth, ph = panel.offsetHeight;
    let left = b.left + b.width / 2 - pw / 2;
    left = Math.min(Math.max(left, 16), win.offsetWidth - 16 - pw);
    panel.style.left = left + "px";
    panel.style.top = (c.top - 10 - ph) + "px";
  }
  const pillEl = win.querySelector("[data-pill]");
  if (pillEl && frame.pill != null) {
    const s = rel(win.querySelector(".seek").getBoundingClientRect());
    const c = rel(ctrl.getBoundingClientRect());
    const x = s.left + s.width * frame.pill;
    const pw = pillEl.offsetWidth, ph = pillEl.offsetHeight;
    const left = Math.min(Math.max(x - pw / 2, 16), win.offsetWidth - 16 - pw);
    pillEl.style.left = left + "px";
    pillEl.style.top = (c.top - 8 - ph) + "px";
    if (frame.cursor) win.insertAdjacentHTML("beforeend", cursor(x - 1.5, s.top + s.height / 2 - 2));
  }
}

// ---------- entry: single frame for headless screenshots, or the gallery ----------
const params = new URLSearchParams(location.search);
const root = document.getElementById("root");
if (params.has("frame")) {
  document.body.classList.add("single");
  const frame = F.find(f => f.id === params.get("frame"));
  const theme = params.get("theme") || "dark";
  root.innerHTML = frame.build(theme);
  place(root, frame);
} else {
  let html = `<div class="gallery"><h1>Reel M2 surfaces</h1><p>Static mockup of every new or changed M2 surface, drawn with the M1 tokens (design sections 9 and 15). The picture is a generated scene, not real media. Window frames are 1280 x 720 pt; fullscreen is the 2560 x 1440 pt display. PNGs are in png/.</p>`;
  for (const f of F) {
    const themes = f.themes || ["light", "dark"];
    const [fw, fh] = f.size || [W, H];
    const s = 600 / fw;
    html += `<section class="entry"><h2>${f.id.slice(0, 2)}. ${f.name}</h2><p>${f.note}</p><div class="pair">`;
    for (const t of themes) html += `<figure class="shot" data-id="${f.id}" data-theme="${t}" style="margin:0;width:${fw * s}px;height:${fh * s}px"><div style="transform:scale(${s});transform-origin:0 0;width:${fw}px;height:${fh}px">${f.build(t)}</div><figcaption>${t}</figcaption></figure>`;
    html += `</div></section>`;
  }
  root.innerHTML = html + `</div>`;
  for (const fig of root.querySelectorAll(".shot")) place(fig, F.find(f => f.id === fig.dataset.id));
}
